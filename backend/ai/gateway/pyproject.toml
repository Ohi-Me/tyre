[project]
name = "tyre-ai-gateway"
version = "3.2.0"
description = "TYRE v3.2 — Python AI gateway: 4 Y1 agents (Dispatch, Pricing, Fraud, Payment), voice pipeline, UPI escrow. Bihar-Jharkhand-UP wedge."
requires-python = ">=3.11"
dependencies = [
  # Pin FastAPI to the 0.115 line (Starlette 0.41.x). Unbounded, this resolved to
  # FastAPI 0.138 / Starlette 1.3, whose mounted-router objects crash
  # prometheus-fastapi-instrumentator's per-request route-name lookup
  # ("'_IncludedRouter' object has no attribute 'path'"), 500-ing /health and
  # leaving the container permanently unhealthy.
  "fastapi[standard]>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "groq>=0.11.0",
  "openai>=1.50.0",
  "redis>=5.0.0",
  "pyjwt>=2.9.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.10",
  # Prometheus metrics — imported by app/main.py. Was missing here, so the image
  # built but crashed on startup with ModuleNotFoundError.
  "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
  # CLDR plural/number/currency formatting (app/ai/localization, v1.1 item #12).
  # Graceful fallback if absent, but pinned so Hindi pluralization is correct.
  "babel>=2.12.0",
  # Phase 0: real Razorpay Route payouts (UPI escrow). If TYRE_RAZORPAY_KEY_ID /
  # TYRE_RAZORPAY_KEY_SECRET are unset, upi_escrow.py falls back to the SIMULATED path
  # and razorpay is lazy-imported, so this dep is harmless in dev environments that
  # haven't set up sandbox credentials yet.
  "razorpay>=1.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
# Y2+ dependencies (not needed for Y1 wedge)
y2 = [
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
  "langchain-groq>=0.2.0",
  "transformers>=4.44.0",
  "torch>=2.4.0",
  "sentencepiece>=0.2.0",
  "qdrant-client>=1.11.0",
  "kafka-python>=2.0.2",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
]
markers = [
  "asyncio: async tests",
  "slow: slow tests (skipped by default in CI)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::RuntimeWarning",
]
