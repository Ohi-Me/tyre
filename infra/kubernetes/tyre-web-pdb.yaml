# TYRE Web — PodDisruptionBudget
# Keeps at least 1 tyre-web pod available during voluntary disruptions
# (node drains, cluster autoscaler, etc.). Supersedes the inline PDB
# previously embedded in 30-ingress.yaml.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tyre-web-pdb
  namespace: tyre-prod
  labels: {app: tyre-web}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: tyre-web}
